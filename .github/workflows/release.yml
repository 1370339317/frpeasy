name: release

# 打 tag 就自动出 Release —— 手工拖 9 个文件进 Release 太容易漏
# （漏了 manifest.json，客户端和面板就都升不上去，而且没有任何报错）。
#
# 用法：
#   git tag v0.5.0 && git push origin v0.5.0
#
# 产物清单（全部自动上传）：
#   - 10 个裸二进制（4 个 panel + 6 个 agent），供一键脚本与自更新使用
#   - manifest.json    自更新的唯一入口，含每个文件的 sha256
#   - SHA256SUMS       给人手工核验
#   - bundles/*.tar.gz 绿色包：二进制 + systemd unit + 使用说明
#   - deploy.sh        一键部署脚本（README 里那条命令要靠它）
#   - frpeasy.service  systemd unit 模板（deploy.sh 会拉这个，保证只有一份）

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发：没打 tag 也想验证构建、或补发一次 Release
  workflow_dispatch:

permissions:
  # 创建 Release 并上传资产需要写权限。用仓库内置的 GITHUB_TOKEN，
  # 不需要用户配任何 secret。
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读版本，避免这里和 go.mod 各写一个数字而漂移
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 确定版本号
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's/^VERSION[[:space:]]*?*=[[:space:]]*//p' Makefile | head -1)
            echo "version=${v:-0.0.0-dev}" >> "$GITHUB_OUTPUT"
          fi

      # 前端必须先构建：go:embed 在编译期把 internal/webui/dist 打进二进制，
      # 不先跑 Vite 的话，发出去的二进制里只有一个「前端未构建」的说明页。
      - name: 构建前端
        run: cd web && npm ci && npm run build

      - name: 跑单元测试
        run: go test ./... -count=1

      - name: 构建全部平台产物 + 清单 + 绿色包
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # NOTES 用该 commit 的标题（tag push 没有 head_commit 事件字段）
          NOTES=$(git log -1 --pretty=%s)
          make dist VERSION="$VERSION" NOTES="$NOTES"

      # make dist 末尾已经跑过 check-manifest，这里再算一遍独立校验和给人核验。
      # 两者作用不同：check-manifest 保证「清单与产物一致」，
      # SHA256SUMS 让人能在下载后不依赖清单自己核一遍。
      - name: 生成校验和
        run: |
          cd bin
          sha256sum frpeasy-* > SHA256SUMS
          echo "---"
          cat SHA256SUMS

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            bin/frpeasy-*
            bin/manifest.json
            bin/SHA256SUMS
            bin/bundles/*.tar.gz
            scripts/deploy.sh
            scripts/frpeasy.service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
